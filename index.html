<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Capicua</title>
    <!-- Librería MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#63c7e8; color:#003344; }
        .header { background:#005b75; color:white; text-align:center; padding:15px; font-size:24px; font-weight:bold; }
        .connection { display:flex; justify-content:center; gap:15px; margin:12px; flex-wrap:wrap; }
        .conn { background:white; padding:8px 12px; border-radius:12px; font-weight:bold; }
        .led { width:12px; height:12px; display:inline-block; border-radius:50%; background:red; margin-right:5px; }
        .card { background:white; margin:8px; padding:10px; border-radius:14px; text-align:center; box-shadow:0 2px 5px #777; }
        .title { font-size:13px; color:#006080; font-weight:bold; }
        .value { font-size:25px; font-weight:bold; color:#008000; margin-top:5px; }
        .row { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
        .row .card { flex:1; min-width:90px; }
        .alarm { color:red !important; }
        .button { background:#006080; color:white; cursor:pointer; }
        .button.on { background:#FFD700; color:#000; }
        .button.off { background:#AAAAAA; color:#FFFFFF; }
        .statusGPS { font-weight:bold; color:#008000; margin-top: 5px; }
    </style>
</head>

<body>

    <div class="header">⛵ PANEL CAPICUA</div>

    <div class="connection">
        <div class="conn"><span id="ledWifi" class="led"></span>WiFi</div>
        <div class="conn"><span id="ledMQTT" class="led"></span>MQTT</div>
        <div class="conn"><span id="ledBT" class="led"></span>BT</div>
    </div>

    <div class="card">
        <div class="title">GPS</div>
        <div class="row">
            <div class="card"><div class="title">LAT</div><div class="value" id="lat">--</div></div>
            <div class="card"><div class="title">LON</div><div class="value" id="lon">--</div></div>
        </div>
        <div id="gps" class="statusGPS">--</div>
    </div>

    <div class="row">
        <div class="card"><div class="title">VIENTO</div><div class="value"><span id="wind">--</span> kt</div></div>
        <div class="card"><div class="title">ANGULO</div><div class="value"><span id="angle">--</span>°</div></div>
    </div>

    <div class="row">
        <div class="card"><div class="title">MOTOR</div><div class="value" id="bat_m">--</div></div>
        <div class="card"><div class="title">SERV</div><div class="value" id="bat_s">--</div></div>
        <div class="card"><div class="title">PROA</div><div class="value" id="bat_b">--</div></div>
    </div>

    <div class="row">
        <div class="card button off" id="out1"><div class="title">OUT 1</div><div class="value">OFF</div></div>
        <div class="card button off" id="out2"><div class="title">OUT 2</div><div class="value">OFF</div></div>
        <div class="card button off" id="out3"><div class="title">OUT 3</div><div class="value">OFF</div></div>
    </div>

    <div class="row">
        <div class="card button off" id="out4"><div class="title">GPS CTRL</div><div class="value">OFF</div></div>
        <div class="card button off" id="out5"><div class="title">DESHUMIDIF.</div><div class="value">OFF</div></div>
    </div>

    <script>
        // Verificación de seguridad: esperar a que la librería cargue
        if (typeof mqtt === 'undefined') {
            alert("Error: La librería MQTT no cargó. Revisa tu conexión.");
        } else {
            const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

            client.on("connect", () => {
                console.log("MQTT conectado");
                client.subscribe("boat2/data");
            });

            client.on("message", (topic, msg) => {
                let d;
                try { d = JSON.parse(msg.toString()); } catch(e) { return; }
                
                // LEDs (Adaptados al ESP: wifiStatus e mqttStatus locales se manejan vía string/estado, bt viene en d.bt)
                led("ledWifi", true); // Si llega mensaje por MQTT, hay conectividad general
                led("ledMQTT", d.mq == "OK");
                led("ledBT", d.bt == "OK");

                // Datos de Navegación y Viento
                document.getElementById("lat").innerHTML = d.lat ?? "--";
                document.getElementById("lon").innerHTML = d.lon ?? "--";
                document.getElementById("gps").innerHTML = d.gps ? "GPS OK" : "GPS SIN SEÑAL";
                document.getElementById("wind").innerHTML = number(d.wind_speed);
                document.getElementById("angle").innerHTML = Math.round(d.wind_angle ?? 0);

                // Baterías y Alarmas (Variables ajustadas a bm, bs, bb, am, as, ab)
                updateBattery("bat_m", d.bm, d.am);
                updateBattery("bat_s", d.bs, d.as);
                updateBattery("bat_b", d.bb, d.ab);

                // Botones / Salidas (out1 a out5)
                updateOutput("out1", d.o1);
                updateOutput("out2", d.o2);
                updateOutput("out3", d.o3);
                updateOutput("out4", d.o4);
                updateOutput("out5", d.o5);
            });

            function led(id, state) { 
                let e = document.getElementById(id); 
                if(e) e.style.background = state ? "green" : "red"; 
            }

            function number(v) { return (v == null) ? "--" : Number(v).toFixed(1); }

            function updateBattery(id, val, alarm) {
                let e = document.getElementById(id);
                if(e) {
                    e.innerHTML = (val != null) ? val + " V" : "-- V";
                    e.className = alarm ? "value alarm" : "value";
                }
            }

            function updateOutput(id, state) {
                let e = document.getElementById(id);
                if(!e) return;
                e.className = state ? "card button on" : "card button off";
                e.querySelector(".value").innerHTML = state ? "ON" : "OFF";
            }

            function command(cmd, state) {
                client.publish("boat2/cmd", JSON.stringify({ "cmd": cmd, "value": state }));
            }

            // Enlazando los comandos con las nuevas claves JSON del ESP (o1, o2, o3, o4, o5)
            document.getElementById("out1").onclick = () => command("o1", !document.getElementById("out1").classList.contains("on"));
            document.getElementById("out2").onclick = () => command("o2", !document.getElementById("out2").classList.contains("on"));
            document.getElementById("out3").onclick = () => command("o3", !document.getElementById("out3").classList.contains("on"));
            document.getElementById("out4").onclick = () => command("o4", !document.getElementById("out4").classList.contains("on"));
            document.getElementById("out5").onclick = () => command("o5", !document.getElementById("out5").classList.contains("on"));
        }
    </script>
</body>
</html>
