<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capicua - Sistema de Bordo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; margin: 10px auto; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .alarm-on { color: #ff4444; font-weight: bold; animation: blink 1s infinite; }
        .alarm-off { color: #00C851; font-weight: bold; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        h3 { margin-top: 0; color: #33b5e5; }
    </style>
</head>
<body>
    <h1>Capicua - Sistema de Bordo</h1>
    
    <div class="card">
        <h3>Baterías y Alarmas</h3>
        <p>Motor: <span id="bat_motor" class="alarm-off">0.0 V</span></p>
        <p>Servicio: <span id="bat_service" class="alarm-off">0.0 V</span></p>
        <p>Proa: <span id="bat_bow" class="alarm-off">0.0 V</span></p>
        <p>Sentina (Agua): <span id="bilge_alarm" class="alarm-off">OK</span></p>
    </div>

    <div class="card">
        <h3>Navegación</h3>
        <p>Profundidad (Pr): <span id="depth">0.0</span> m</p>
    </div>

    <script>
        // Umbrales locales para las baterías
        const MOTOR_LOW = 12.0;
        const SERVICE_LOW = 11.8;
        const BOW_LOW = 12.0;

        function updateUI(d) {
            // 1. Batería Motor
            if (d.bm !== undefined) {
                let bm = Number(d.bm);
                let alarmMotor = bm < MOTOR_LOW;
                document.getElementById("bat_motor").innerText = bm.toFixed(1) + " V";
                document.getElementById("bat_motor").className = alarmMotor ? "alarm-on" : "alarm-off";
            }

            // 2. Batería Servicio
            if (d.bs !== undefined) {
                let bs = Number(d.bs);
                let alarmService = bs < SERVICE_LOW;
                document.getElementById("bat_service").innerText = bs.toFixed(1) + " V";
                document.getElementById("bat_service").className = alarmService ? "alarm-on" : "alarm-off";
            }

            // 3. Batería Proa
            if (d.bb !== undefined) {
                let bb = Number(d.bb);
                let alarmBow = bb < BOW_LOW;
                document.getElementById("bat_bow").innerText = bb.toFixed(1) + " V";
                document.getElementById("bat_bow").className = alarmBow ? "alarm-on" : "alarm-off";
            }

            // 4. Sentina (Ag) - Exactamente como funcionaba antes con tu variable d.Ag
            if (d.Ag !== undefined) {
                let bilgeEl = document.getElementById("bilge_alarm");
                bilgeEl.innerText = d.Ag ? "ALARMA" : "OK";
                bilgeEl.className = d.Ag ? "alarm-on" : "alarm-off";
            }

            // 5. Profundidad (Pr)
            if (d.Pr !== undefined) {
                document.getElementById("depth").innerText = Number(d.Pr).toFixed(1);
            }
        }
    </script>
</body>
</html>
